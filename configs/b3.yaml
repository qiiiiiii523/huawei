architecture_id: B3_multiscale_cnn_time_transformer_fpn_v1
implemented_stages: [P0_anchor_only, P1-C3]
implemented_fusion_modes: [none, film_gated_residual]

model:
  transformer_layers: 4
  dropout: 0.10
  context_dropout: 0.00
  source_dropout: 0.00
training:
  seed: 42
  deterministic: true
  batch_size: 4
  epochs: 1
  anchor_lr: 0.001
  context_lr: 0.002
  weight_decay: 0.0001
  freeze_anchor_epochs: 0
  stage1_loss: strict_anchor_pretrain
  stage2_loss: joint_anchor_sync
validation:
  checkpoint_metric: r_submit_12
  output_raw: prediction_raw.npy
  output_submit: prediction_submit.npy
  shuffled_context: true
