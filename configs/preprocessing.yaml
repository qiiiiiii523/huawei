protocol_version: "v2.0-joint-anchor-preprocessing"
protocol_status: frozen_joint_anchor
raw_data_mutation: false
baseline: {method: per_window_per_lead_median}
scaling:
  method: train_median_p5_p95_range
  fit_split: train
  minimum_scale_uV: 25.0
  clip_model_signal: 12.0
sources:
  watch_ecg: {expected_leads: 1}
  ecg_machine_d6: {expected_leads: 6}
  body_scale_d6: {expected_leads: 6}
  ecg_machine_i: {expected_leads: 1, scale_fit_source: "train_target_d12:I"}
  d12: {expected_leads: 12}
target_transform: d12
target_baseline_policy: train_label_only_predict_at_inference
output_contract:
  model_output_view: centered_scaled_d12
  morphology_uV: "model_output_view * frozen_d12_scale_uV"
  raw_uV: "morphology_uV + model_predicted_d12_baseline_uV"
  prohibited_at_inference: using_true_target_baseline_uV
evaluation_views: {official: raw_uV, morphology_diagnostic: centered_per_window_uV}
