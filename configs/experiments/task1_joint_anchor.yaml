experiment: task1_joint_anchor
strict_stage:
  supervision_mode: d12_i_pretrain
  train_only: true
  anchor_target_relation: same_record_same_window
  pointwise_loss_allowed: true
  loss_profile: strict_anchor_pretrain
experiments:
  P0_anchor_only:
    input: machine_i_anchor
    initialization: strict_anchor_pretrain
    context_enabled: false
    output: full_d12_prediction
    training_output_i_replacement: forbidden
    validation_metrics: [r_raw_12, r_submit_12, r_missing11]
  P1_context_conditioned:
    input: [watch_ecg_context, machine_i_anchor]
    initialization: required_P0_strict_pretrained_weights
    context_enabled: true
    output: full_d12_prediction
    training_output_i_replacement: forbidden
    comparison_baseline: P0_anchor_only
    validation_metrics: [r_raw_12, r_submit_12, r_missing11]
joint_stage:
  supervision_mode: joint_anchor_adaptation
  context_source: watch_ecg
  anchor_source: ecg_machine_i
  context_target_relation: same_subject_cross_time
  anchor_target_relation: same_record_same_window
  pointwise_loss_allowed: true
  observed_target_time_leads: [I]
  generated_leads: [II, III, aVR, aVL, aVF, V1, V2, V3, V4, V5, V6]
  loss_profile: joint_anchor_sync
  training_output_i_replacement: forbidden
  validation_submit_output_i_replacement: required
