experiment: B2_joint_anchor_patch_transformer
public_contract:
  strict_anchor_pretrain: d12_i_pretrain
  joint_anchor_adaptation: joint_anchor_adaptation
  anchor_target_relation: same_record_same_window
  context_target_relation: same_subject_cross_time
  validation_input_contract: joint_anchor_test_like
model:
  patch_size: 25
  d_model: 192
  anchor_time_transformer_layers: 4
  attention_heads: 6
  context_transformer_layers: 2
  dropout: 0.10
fusion:
  modes: [none, film, gated_residual, film_gated_residual]
  context_dropout: 0.10
  initial_gate: 0.05
  residual_last_layer: zero_initialized
experiments:
  B2-P0: {stage: P0_anchor_only, fusion_mode: none, context_view: none}
  B2-C1: {stage: P1_joint_anchor, fusion_mode: film, context_view: auto}
  B2-C2: {stage: P1_joint_anchor, fusion_mode: gated_residual, context_view: auto}
  B2-C3: {stage: P1_joint_anchor, fusion_mode: film_gated_residual, context_view: auto}
  T1-P0: {task_id: task1, stage: P0_anchor_only, fusion_mode: none, context_view: none}
  T1-C1-watch: {task_id: task1, stage: P1_joint_anchor, fusion_mode: film, context_view: watch}
  T1-C2-watch: {task_id: task1, stage: P1_joint_anchor, fusion_mode: gated_residual, context_view: watch}
  T1-C3-watch: {task_id: task1, stage: P1_joint_anchor, fusion_mode: film_gated_residual, context_view: watch}
  T1-shuffle-C3-watch: {task_id: task1, stage: P1_joint_anchor, fusion_mode: film_gated_residual, context_view: shuffle_watch, diagnostic_only: true}
  T2-P0: {task_id: task2, stage: P0_anchor_only, fusion_mode: none, context_view: none}
  T2-C1-machine: {task_id: task2, stage: P1_joint_anchor, fusion_mode: film, context_view: machine}
  T2-C2-machine: {task_id: task2, stage: P1_joint_anchor, fusion_mode: gated_residual, context_view: machine}
  T2-C3-machine: {task_id: task2, stage: P1_joint_anchor, fusion_mode: film_gated_residual, context_view: machine}
  T2-C1-body: {task_id: task2, stage: P1_joint_anchor, fusion_mode: film, context_view: body}
  T2-C2-body: {task_id: task2, stage: P1_joint_anchor, fusion_mode: gated_residual, context_view: body}
  T2-C3-body: {task_id: task2, stage: P1_joint_anchor, fusion_mode: film_gated_residual, context_view: body}
  T2-C3-both: {task_id: task2, stage: P1_joint_anchor, fusion_mode: film_gated_residual, context_view: both}
  T2-shuffle-C3: {task_id: task2, stage: P1_joint_anchor, fusion_mode: film_gated_residual, context_view: shuffle, diagnostic_only: true}
