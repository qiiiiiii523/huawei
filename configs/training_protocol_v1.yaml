protocol_version: "v2.0-joint-anchor"
protocol_status: frozen_public_contract
reproducibility: {seed: 42, deterministic: true}
data:
  split_source: metadata/subject_split.csv
  split_strategy: fixed_subject_level
  train_split: train
  validation_split: validation
  preprocessing: unified_runtime_preprocessing_v2
  preprocessing_config: configs/preprocessing.yaml
  raw_data_mutation: false
  default_training_quality: paired_and_usable_only
  under_30_sec_policy: exclude_from_training
context_fusion_protocol:
  config: configs/context_fusion_protocol.yaml
  standard: context-fusion-standard-v1
  stages: [P0_anchor_only, P1-C1, P1-C2, P1-C3]
  applies_to: [B1, B2, B3, M1]
  network_modules_implemented_by: baseline_branch
  main_does_not_implement_fusion_modules: true
two_stage_protocol:
  strict_anchor_pretrain:
    supervision_mode: d12_i_pretrain
    input: "train-only d12 I"
    target: d12
    strict_index: metadata/d12_strict_pretrain_index.csv
    output: full_d12_prediction
    loss_profile: strict_anchor_pretrain
    experiment: P0_anchor_only
  joint_anchor_adaptation:
    supervision_mode: joint_anchor_adaptation
    input: "cross-time context ECG + target-time machine I anchor"
    context_target_relation: same_subject_cross_time
    anchor_target_relation: same_record_same_window
    context_target_pointwise_loss: forbidden
    anchor_target_missing_lead_pointwise_loss: permitted
    output: full_d12_prediction
    training_output_i_replacement: forbidden
    initialization: required_P0_strict_pretrained_weights
    experiments: [P1-C1, P1-C2, P1-C3]
    comparison_baseline: P0_anchor_only
    test_anchor_requirement: organizer_explicit_machine_i_anchor
model_input_output:
  input_view: centered_scaled_context_plus_anchor_with_separate_masks
  target_view: centered_scaled_d12
  raw_output_for_official_evaluation: "morphology_uV + model_predicted_d12_baseline_uV"
  true_target_baseline_at_inference: forbidden
validation:
  run_on: validation_only
  input_contract: joint_anchor_test_like
  official_view: raw_uV
  primary_metric_task1: task1_r1
  primary_metric_task2: task2_r2
  task2_bonus_metric: task2_missing_lead_mean_rmse_uV
  morphology_diagnostic_view: centered_per_window_uV
  checkpoint_selection: best_validation_official_v0
  required_metrics: [r_raw_12, r_submit_12, r_missing11]
  official_prediction_view: submit_anchor_i_replaced
results: {record_template: docs/experiment-record-template.md, generated_output_dir: results}
